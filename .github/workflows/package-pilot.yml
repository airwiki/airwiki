name: Package technical candidates

on:
  workflow_dispatch:
    inputs:
      target:
        description: Candidate set to build or publish
        required: true
        default: windows-x64-beta
        type: choice
        options:
          - windows-msi-smoke-no-artifact
          - windows-x64-beta
          - all-internal-candidates
          - public-prerelease
      prerelease_number:
        description: Numeric beta suffix used only for public-prerelease
        required: true
        default: "1"
        type: string
      publication_confirmation:
        description: For publication, enter publish-v<version>-beta.<number>
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: package-technical-candidate-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate exact candidate request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - id: request
        name: Validate exact source and publication authority
        env:
          PRERELEASE_NUMBER: ${{ inputs.prerelease_number }}
          PUBLICATION_CONFIRMATION: ${{ inputs.publication_confirmation }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "airwiki/airwiki" ]]; then
            echo "technical candidates are restricted to airwiki/airwiki" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "technical candidates must be built from main" >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          if [[ "$commit" != "$GITHUB_SHA" ]] || [[ -n "$(git status --porcelain)" ]]; then
            echo "technical candidate source is not the exact clean workflow commit" >&2
            exit 1
          fi
          version="$(node packaging/release-version.mjs)"
          tag=""
          if [[ "$TARGET" != "windows-msi-smoke-no-artifact" ]]; then
            if [[ ! "$PRERELEASE_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]]; then
              echo "prerelease number must be from 1 to 9999" >&2
              exit 1
            fi
            tag="v${version}-beta.${PRERELEASE_NUMBER}"
          fi
          if [[ "$TARGET" == "public-prerelease" ]]; then
            if [[ "$PUBLICATION_CONFIRMATION" != "publish-${tag}" ]]; then
              echo "public prerelease confirmation must equal publish-${tag}" >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  linux-x64-federation-index:
    name: Linux x64 federation index
    needs: validate-request
    if: inputs.target == 'all-internal-candidates' || inputs.target == 'public-prerelease'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build federation index
        run: cargo build --release --locked -p airwiki-federation-index
      - name: Verify Linux x64 candidate
        run: |
          file target/release/airwiki-federation-index |
            grep -F 'ELF 64-bit LSB pie executable, x86-64'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airwiki-linux-x64-federation-index
          path: target/release/airwiki-federation-index
          if-no-files-found: error
          retention-days: 30

  macos-arm64:
    name: macOS arm64 app and DMG
    needs: validate-request
    if: inputs.target == 'all-internal-candidates' || inputs.target == 'public-prerelease'
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned frontend dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm --dir apps/desktop/ui install --frozen-lockfile --ignore-scripts --prod=false
          pnpm --dir apps/desktop/ui run licenses:check macos-arm64
      - name: Package ad-hoc macOS candidate
        run: ./packaging/package-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airwiki-macos-arm64-unsigned
          path: target/packages/macos
          if-no-files-found: error
          retention-days: 30

  windows-x64:
    name: Windows x64 unsigned beta MSI
    needs: validate-request
    if: inputs.target == 'windows-msi-smoke-no-artifact' || inputs.target == 'windows-x64-beta' || inputs.target == 'all-internal-candidates' || inputs.target == 'public-prerelease'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Validate exact beta source
        shell: powershell
        run: |
          if ($env:GITHUB_REPOSITORY -cne "airwiki/airwiki") {
            throw "unsigned beta artifacts are restricted to airwiki/airwiki"
          }
          if ($env:GITHUB_REF -cne "refs/heads/main") {
            throw "unsigned beta artifacts must be built from main"
          }
          $Commit = (git rev-parse HEAD).Trim()
          if ($Commit -cne $env:GITHUB_SHA) {
            throw "checked-out commit does not match the workflow commit"
          }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) {
            throw "unsigned beta source checkout is not clean"
          }
          node.exe packaging/release-version.mjs
          if ($LASTEXITCODE -ne 0) { throw "release version validation failed" }
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.96.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned frontend dependencies
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm.cmd --dir apps/desktop/ui install --frozen-lockfile --ignore-scripts --prod=false
          pnpm.cmd --dir apps/desktop/ui run licenses:check windows-x64
      - name: Package unsigned Windows candidate
        shell: powershell
        run: ./packaging/package-windows.ps1
      - name: Check Windows MSI smoke contract
        shell: powershell
        run: ./packaging/test-smoke-windows-msi.ps1
      - name: Smoke unsigned en-US MSI install and uninstall
        shell: powershell
        run: |
          $Installer = Get-ChildItem target\packages\windows -File -Filter '*_x64_en-US.msi'
          if (@($Installer).Count -ne 1) {
            throw "expected exactly one en-US MSI installer for the smoke test"
          }
          ./packaging/smoke-windows-msi.ps1 `
            -Installer $Installer.FullName `
            -AuthorizeDestructiveMsiSmoke
      - name: Verify unsigned beta and prepare tester artifact
        if: inputs.target != 'windows-msi-smoke-no-artifact'
        shell: powershell
        run: |
          $Commit = (git rev-parse HEAD).Trim()
          $Installers = @(Get-ChildItem target\packages\windows -File -Filter *.msi)
          if ($Installers.Count -ne 2) {
            throw "expected exactly two localized MSI installers"
          }
          foreach ($Installer in $Installers) {
            $Signature = Get-AuthenticodeSignature -LiteralPath $Installer.FullName
            if ($Signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "unsigned beta channel received an installer with an unexpected signature state"
            }
          }
          $Version = (node.exe packaging/release-version.mjs).Trim()
          if ($LASTEXITCODE -ne 0) { throw "release version validation failed" }
          ./packaging/prepare-unsigned-windows-beta.ps1 `
            -PackageRoot target\packages\windows `
            -OutputRoot target\packages\windows-unsigned-beta `
            -Version $Version `
            -CommitSha $Commit `
            -Repository $env:GITHUB_REPOSITORY `
            -WorkflowRunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
            -RetentionDays 30
      - id: upload-windows-beta
        if: inputs.target != 'windows-msi-smoke-no-artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airwiki-windows-x64-unsigned-beta-${{ github.sha }}
          path: target/packages/windows-unsigned-beta
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Summarize beta artifact
        if: inputs.target != 'windows-msi-smoke-no-artifact'
        shell: powershell
        run: |
          $ChecksumSummary = @(
            Get-Content target\packages\windows-unsigned-beta\SHA256SUMS.txt |
              ForEach-Object { "    $_" }
          ) -join "`n"
          @"
          ## Windows unsigned beta

          - Commit: ``$env:GITHUB_SHA``
          - Retention: 30 days
          - GitHub artifact digest: ``${{ steps.upload-windows-beta.outputs.artifact-digest }}``
          - This is an unsigned technical-testing candidate, not a supported public release.

          Installer SHA-256 values:

          $ChecksumSummary
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  publish-technical-prerelease:
    name: Publish protected public technical prerelease
    if: inputs.target == 'public-prerelease'
    needs:
      - validate-request
      - linux-x64-federation-index
      - macos-arm64
      - windows-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: public-release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airwiki-linux-x64-federation-index
          path: target/technical-prerelease-input/linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airwiki-macos-arm64-unsigned
          path: target/technical-prerelease-input/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airwiki-windows-x64-unsigned-beta-${{ github.sha }}
          path: target/technical-prerelease-input/windows
      - name: Stage and verify the closed prerelease asset set
        env:
          BETA_NUMBER: ${{ inputs.prerelease_number }}
          VERSION: ${{ needs.validate-request.outputs.version }}
        run: |
          set -euo pipefail
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 packaging/technical_prerelease.py prepare \
            --input-root target/technical-prerelease-input \
            --macos-dmg "target/technical-prerelease-input/macos/AirWiki_${VERSION}_aarch64.dmg" \
            --windows-en "target/technical-prerelease-input/windows/AirWiki_${VERSION}_x64_en-US.msi" \
            --windows-es "target/technical-prerelease-input/windows/AirWiki_${VERSION}_x64_es-ES.msi" \
            --linux-binary target/technical-prerelease-input/linux/airwiki-federation-index \
            --output target/technical-prerelease \
            --version "$VERSION" \
            --beta-number "$BETA_NUMBER" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --generated-at "$generated_at"
      - name: Attest the exact closed prerelease asset set
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "target/technical-prerelease/assets/*"
      - id: draft
        name: Create or recover the exact private draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-request.outputs.tag }}
          VERSION: ${{ needs.validate-request.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t expected_assets < <(
            find target/technical-prerelease/assets -maxdepth 1 -type f -printf '%f\n' | sort
          )
          if release="$(gh release view "$TAG" --json assets,isDraft,isPrerelease,targetCommitish 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$release")" != "true" ]] ||
               [[ "$(jq -r '.isPrerelease' <<<"$release")" != "true" ]] ||
               [[ "$(jq -r '.targetCommitish' <<<"$release")" != "$GITHUB_SHA" ]]; then
              echo "existing release is not the recoverable exact draft" >&2
              exit 1
            fi
            mapfile -t existing_assets < <(jq -r '.assets[].name' <<<"$release" | sort)
            unexpected="$(comm -23 \
              <(printf '%s\n' "${existing_assets[@]}") \
              <(printf '%s\n' "${expected_assets[@]}"))"
            if [[ -n "$unexpected" ]]; then
              echo "existing draft contains an unexpected asset" >&2
              exit 1
            fi
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
              if [[ "$(git rev-list -n 1 "$TAG")" != "$GITHUB_SHA" ]]; then
                echo "existing prerelease tag does not resolve to the workflow commit" >&2
                exit 1
              fi
              gh release create "$TAG" \
                --verify-tag \
                --draft \
                --prerelease \
                --latest=false \
                --title "AirWiki ${VERSION} — technical beta (unsigned)" \
                --notes-file target/technical-prerelease/RELEASE_NOTES.md
            else
              gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --draft \
                --prerelease \
                --latest=false \
                --title "AirWiki ${VERSION} — technical beta (unsigned)" \
                --notes-file target/technical-prerelease/RELEASE_NOTES.md
            fi
          fi
          gh release edit "$TAG" \
            --draft=true \
            --prerelease=true \
            --title "AirWiki ${VERSION} — technical beta (unsigned)" \
            --notes-file target/technical-prerelease/RELEASE_NOTES.md
          gh release upload "$TAG" target/technical-prerelease/assets/* --clobber
          release_id="$(gh release view "$TAG" --json databaseId --jq '.databaseId')"
          echo "release-id=${release_id}" >> "$GITHUB_OUTPUT"
      - name: Re-download and independently verify the private draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-request.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p target/technical-prerelease-verification/assets
          gh release download "$TAG" --dir target/technical-prerelease-verification/assets
          cp target/technical-prerelease/RELEASE_NOTES.md \
            target/technical-prerelease-verification/RELEASE_NOTES.md
          python3 packaging/technical_prerelease.py verify \
            --output target/technical-prerelease-verification
      - name: Verify downloaded assets against GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' asset; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package-pilot.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done < <(
            find target/technical-prerelease-verification/assets \
              -maxdepth 1 -type f -print0
          )
      - name: Publish as a non-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
          TAG: ${{ needs.validate-request.outputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG"
          tag_refs="$(git ls-remote --tags origin "$tag_ref" "${tag_ref}^{}")"
          if [[ -z "$tag_refs" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=$tag_ref" \
              -f "sha=$GITHUB_SHA" >/dev/null
            tag_refs="$(git ls-remote --tags origin "$tag_ref" "${tag_ref}^{}")"
          fi
          tag_commit="$(awk -v tag="$tag_ref" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print peeled != "" ? peeled : direct }
          ' <<<"$tag_refs")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "technical prerelease tag does not resolve to the verified workflow commit" >&2
            exit 1
          fi

          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false >/dev/null
          release="$(gh release view "$TAG" --json assets,isDraft,isPrerelease,tagName,targetCommitish,url)"
          published_commit="$(git ls-remote --tags origin "$tag_ref" "${tag_ref}^{}" | awk -v tag="$tag_ref" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print peeled != "" ? peeled : direct }
          ')"
          if [[ "$(jq -r '.isDraft' <<<"$release")" != "false" ]] ||
             [[ "$(jq -r '.isPrerelease' <<<"$release")" != "true" ]] ||
             [[ "$(jq -r '.tagName' <<<"$release")" != "$TAG" ]] ||
             [[ "$(jq -r '.targetCommitish' <<<"$release")" != "$GITHUB_SHA" ]] ||
             [[ "$published_commit" != "$GITHUB_SHA" ]]; then
            echo "GitHub did not publish the exact technical prerelease" >&2
            exit 1
          fi
          is_latest="$(gh release list --limit 100 --json tagName,isLatest \
            --jq '.[] | select(.tagName == env.TAG) | .isLatest')"
          if [[ "$is_latest" != "false" ]]; then
            echo "technical prerelease must never be GitHub latest" >&2
            exit 1
          fi
          url="$(jq -r '.url' <<<"$release")"
          {
            echo "## Public technical prerelease"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $url"
            echo "- Pre-release: yes"
            echo "- Latest/updater: no"
            echo "- Linux asset: federation index server, not AirWiki Desktop"
          } >> "$GITHUB_STEP_SUMMARY"
