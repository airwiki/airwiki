name: Package unsigned pilot

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x64-federation-index:
    name: Linux x64 federation index
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build federation index
        run: cargo build --release --locked -p airwiki-federation-index
      - name: Verify Linux x64 candidate
        run: |
          file target/release/airwiki-federation-index |
            grep -F 'ELF 64-bit LSB pie executable, x86-64'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airwiki-linux-x64-federation-index
          path: target/release/airwiki-federation-index
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 app and DMG
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned frontend dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm --dir apps/desktop/ui install --frozen-lockfile --ignore-scripts --prod=false
          pnpm --dir apps/desktop/ui run licenses:check macos-arm64
      - name: Package unsigned pilot
        run: ./packaging/package-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airwiki-macos-arm64-unsigned
          path: target/packages/macos
          if-no-files-found: error

  windows-x64:
    name: Windows x64 MSI
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.96.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned frontend dependencies
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm.cmd --dir apps/desktop/ui install --frozen-lockfile --ignore-scripts --prod=false
          pnpm.cmd --dir apps/desktop/ui run licenses:check windows-x64
      - name: Package unsigned pilot
        shell: powershell
        run: ./packaging/package-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airwiki-windows-x64-unsigned
          path: target/packages/windows
          if-no-files-found: error
