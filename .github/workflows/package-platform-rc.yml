name: Package platform release candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA at the current tip of main
        required: true
        type: string
      rc_number:
        description: Numeric release-candidate suffix from 1 through 9999
        required: true
        type: string
      publication_confirmation:
        description: Enter publish-v<version>-rc.<number> exactly
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: package-platform-rc-${{ inputs.commit_sha }}-${{ inputs.rc_number }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  AIRWIKI_RELEASE_COMMIT: ${{ inputs.commit_sha }}
  AIRWIKI_UPDATE_ENDPOINT: https://github.com/airwiki/airwiki/releases/latest/download/latest.json
  AIRWIKI_REQUIRED_RELEASE_CHECKS: |
    Frontend checks (macos-arm64)
    Frontend checks (windows-x64)
    Rust checks (macos-14)
    Rust checks (windows-2022)
    Advisories, licenses and sources
    Launch site checks

jobs:
  validate-request:
    name: Validate exact platform RC request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - id: request
        name: Require the exact green clean tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          RC_NUMBER: ${{ inputs.rc_number }}
          PUBLICATION_CONFIRMATION: ${{ inputs.publication_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$AIRWIKI_RELEASE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character SHA." >&2
            exit 1
          fi
          if [[ ! "$RC_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "rc_number must be an integer from 1 to 9999." >&2
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != "airwiki/airwiki" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "platform release candidates can only start from airwiki/airwiki main." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [[ "$commit" != "$AIRWIKI_RELEASE_COMMIT" || "$commit" != "$main" ]]; then
            echo "release candidate commit must be the exact current tip of main." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "release candidate source checkout is not clean." >&2
            exit 1
          fi
          version="$(node packaging/release-version.mjs)"
          tag="v${version}-rc.${RC_NUMBER}"
          if [[ "$PUBLICATION_CONFIRMATION" != "publish-${tag}" ]]; then
            echo "publication confirmation must equal publish-${tag}." >&2
            exit 1
          fi
          tag_ref="refs/tags/$tag"
          tag_refs="$(git ls-remote --tags origin "$tag_ref" "${tag_ref}^{}")"
          tag_commit="$(awk -v tag="$tag_ref" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print peeled != "" ? peeled : direct }
          ' <<<"$tag_refs")"
          if release="$(gh release view "$tag" --json isDraft,isImmutable,isPrerelease,tagName,targetCommitish 2>/dev/null)"; then
            if [[ "$(jq -r '.isPrerelease' <<<"$release")" != "true" ||
                  "$(jq -r '.tagName' <<<"$release")" != "$tag" ||
                  "$(jq -r '.targetCommitish' <<<"$release")" != "$commit" ]]; then
              echo "existing platform RC release does not match the approved request." >&2
              exit 1
            fi
            if [[ -n "$tag_commit" && "$tag_commit" != "$commit" ]]; then
              echo "existing platform RC tag does not resolve to the approved commit." >&2
              exit 1
            fi
            if [[ "$(jq -r '.isDraft' <<<"$release")" == "false" ]]; then
              [[ "$tag_commit" == "$commit" ]] || { echo "published platform RC must have its exact immutable tag." >&2; exit 1; }
              [[ "$(jq -r '.isImmutable' <<<"$release")" == "true" ]] || { echo "published platform RC assets are not immutable." >&2; exit 1; }
              is_latest="$(gh release list --limit 100 --json tagName,isLatest | \
                jq -r --arg tag "$tag" '.[] | select(.tagName == $tag) | .isLatest')"
              [[ "$is_latest" == "false" ]] || { echo "published platform RC must remain non-Latest." >&2; exit 1; }
            fi
          elif [[ -n "$tag_commit" ]]; then
            echo "platform RC tag exists without its exact recoverable release." >&2
            exit 1
          fi
          check_runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs?per_page=100" --jq '.check_runs[]' | jq -s '{check_runs: .}')"
          while IFS= read -r check; do
            [[ -n "$check" ]] || continue
            matching_count="$(jq -r --arg name "$check" '[.check_runs[] | select(.name == $name)] | length' <<<"$check_runs")"
            if [[ "$matching_count" != "1" ]]; then
              echo "Required release check '$check' must have exactly one run; found $matching_count." >&2
              exit 1
            fi
            if ! jq -e --arg name "$check" '[.check_runs[] | select(.name == $name)] | all(.[]; .conclusion == "success" and .app.slug == "github-actions" and .app.id == 15368)' <<<"$check_runs" >/dev/null; then
              echo "Required release check '$check' is not a successful GitHub Actions run." >&2
              exit 1
            fi
          done <<<"$AIRWIKI_REQUIRED_RELEASE_CHECKS"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "## Platform release candidate request"
            echo
            echo "- Commit: \`$commit\`"
            echo "- Version: \`$version\`"
            echo "- Candidate tag: \`$tag\`"
            echo "- Updater manifest: not produced"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-arm64-notarized-rc:
    name: macOS arm64 notarized RC
    needs: validate-request
    runs-on: macos-14
    timeout-minutes: 90
    environment: macos-signing
    env:
      AIRWIKI_RELEASE_VERSION: ${{ needs.validate-request.outputs.version }}
      AIRWIKI_SIGNING_IDENTITY: ${{ vars.AIRWIKI_MACOS_SIGNING_IDENTITY }}
      AIRWIKI_MACOS_TEAM_ID: ${{ vars.AIRWIKI_MACOS_TEAM_ID }}
      AIRWIKI_UPDATER_PUBLIC_KEY: ${{ vars.AIRWIKI_UPDATER_PUBLIC_KEY }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Revalidate exact green source before requesting signing secrets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [[ "$commit" != "$AIRWIKI_RELEASE_COMMIT" || "$commit" != "$main" || -n "$(git status --porcelain)" ]]; then
            echo "platform RC source no longer matches the clean current main tip." >&2
            exit 1
          fi
          node packaging/release-version.mjs --expect "$AIRWIKI_RELEASE_VERSION"
          check_runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs?per_page=100" --jq '.check_runs[]' | jq -s '{check_runs: .}')"
          while IFS= read -r check; do
            [[ -n "$check" ]] || continue
            count="$(jq -r --arg name "$check" '[.check_runs[] | select(.name == $name)] | length' <<<"$check_runs")"
            [[ "$count" == "1" ]] || { echo "Required release check '$check' is not unique." >&2; exit 1; }
            jq -e --arg name "$check" '[.check_runs[] | select(.name == $name)] | all(.[]; .conclusion == "success" and .app.slug == "github-actions" and .app.id == 15368)' <<<"$check_runs" >/dev/null || { echo "Required release check '$check' is not green GitHub Actions." >&2; exit 1; }
          done <<<"$AIRWIKI_REQUIRED_RELEASE_CHECKS"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm --dir apps/desktop/ui install --frozen-lockfile --ignore-scripts --prod=false
          pnpm --dir apps/desktop/ui run licenses:check macos-arm64
      - name: Revalidate source and release gates immediately before signing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [[ "$commit" != "$AIRWIKI_RELEASE_COMMIT" || "$commit" != "$main" || -n "$(git status --porcelain)" ]]; then
            echo "platform RC source changed before signing and notarization." >&2
            exit 1
          fi
          check_runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs?per_page=100" --jq '.check_runs[]' | jq -s '{check_runs: .}')"
          while IFS= read -r check; do
            [[ -n "$check" ]] || continue
            count="$(jq -r --arg name "$check" '[.check_runs[] | select(.name == $name)] | length' <<<"$check_runs")"
            [[ "$count" == "1" ]] || { echo "Required release check '$check' is not unique." >&2; exit 1; }
            jq -e --arg name "$check" '[.check_runs[] | select(.name == $name)] | all(.[]; .conclusion == "success" and .app.slug == "github-actions" and .app.id == 15368)' <<<"$check_runs" >/dev/null || { echo "Required release check '$check' is not green GitHub Actions." >&2; exit 1; }
          done <<<"$AIRWIKI_REQUIRED_RELEASE_CHECKS"
      - name: Sign, notarize and verify the macOS RC
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          required=(AIRWIKI_SIGNING_IDENTITY AIRWIKI_MACOS_TEAM_ID AIRWIKI_UPDATER_PUBLIC_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD APPLE_API_PRIVATE_KEY_BASE64 TAURI_SIGNING_PRIVATE_KEY)
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "Required macOS release setting is missing: $name" >&2; exit 1; }
          done
          private_root="$(mktemp -d "${RUNNER_TEMP}/airwiki-signing.XXXXXX")"
          keychain="$private_root/release.keychain-db"
          certificate="$private_root/developer-id.p12"
          api_key="$private_root/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() { security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -rf -- "$private_root"; }
          trap cleanup EXIT
          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$api_key"
          chmod 0600 "$certificate" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$AIRWIKI_SIGNING_IDENTITY" >/dev/null
          APPLE_API_KEY_PATH="$api_key" ./packaging/release-macos.sh
          ./packaging/verify-macos-release.sh target/packages/macos
      - name: Keep only the notarized DMG and immutable verification receipt
        shell: bash
        run: |
          set -euo pipefail
          source_dir="target/packages/macos"
          output_dir="target/platform-rc-macos"
          dmg="AirWiki_${AIRWIKI_RELEASE_VERSION}_aarch64.dmg"
          rm -rf -- "$output_dir"
          mkdir -p "$output_dir"
          test -f "$source_dir/$dmg" && test ! -L "$source_dir/$dmg"
          cp "$source_dir/$dmg" "$output_dir/$dmg"
          python3 - "$output_dir/MACOS-VERIFICATION.json" "$AIRWIKI_RELEASE_COMMIT" "$AIRWIKI_RELEASE_VERSION" "$output_dir/$dmg" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          receipt_path, commit, version, dmg_path = sys.argv[1:]
          dmg = Path(dmg_path)
          digest = hashlib.sha256()
          with dmg.open("rb") as payload:
              for chunk in iter(lambda: payload.read(1024 * 1024), b""):
                  digest.update(chunk)
          Path(receipt_path).write_text(json.dumps({
              "schema": "airwiki-macos-platform-rc-verification-v1",
              "commit": commit,
              "version": version,
              "verification": "release-macos-and-verify-macos-release-completed",
              "artifacts": [{"name": dmg.name, "sha256": digest.hexdigest()}],
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 - "$output_dir" "$dmg" <<'PY'
          import sys
          from pathlib import Path
          root, dmg = map(Path, sys.argv[1:])
          if {entry.name for entry in root.iterdir()} != {dmg.name, "MACOS-VERIFICATION.json"}:
              raise ValueError("macOS RC artifact directory is not closed")
          PY
          {
            echo "## Notarized macOS platform RC"
            echo
            echo "- DMG: \`$dmg\`"
            echo "- Notarization and native verification: complete"
            echo "- Updater manifest: not produced"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airwiki-macos-arm64-notarized-rc-${{ inputs.commit_sha }}
          path: target/platform-rc-macos
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows-x64-unsigned-beta:
    name: Windows x64 unsigned technical beta
    needs: validate-request
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      AIRWIKI_RELEASE_VERSION: ${{ needs.validate-request.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Validate exact beta source
        shell: powershell
        run: |
          if ($env:GITHUB_REPOSITORY -cne "airwiki/airwiki" -or $env:GITHUB_REF -cne "refs/heads/main") { throw "unsigned beta artifacts are restricted to airwiki/airwiki main" }
          $Commit = (git rev-parse HEAD).Trim()
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          $Main = (git rev-parse origin/main).Trim()
          if ($Commit -cne $env:AIRWIKI_RELEASE_COMMIT -or $Commit -cne $Main) { throw "Windows beta must build the exact current main tip" }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) { throw "Windows beta source checkout is not clean" }
          node.exe packaging/release-version.mjs --expect $env:AIRWIKI_RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "release version validation failed" }
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.96.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned frontend dependencies
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm.cmd --dir apps/desktop/ui install --frozen-lockfile --ignore-scripts --prod=false
          pnpm.cmd --dir apps/desktop/ui run licenses:check windows-x64
      - name: Package unsigned Windows candidate
        shell: powershell
        run: ./packaging/package-windows.ps1
      - name: Check Windows MSI smoke contract
        shell: powershell
        run: ./packaging/test-smoke-windows-msi.ps1
      - name: Smoke unsigned en-US MSI install and uninstall
        shell: powershell
        run: |
          $Installer = @(Get-ChildItem target\packages\windows -File -Filter '*_x64_en-US.msi')
          if ($Installer.Count -ne 1) { throw "expected exactly one en-US MSI installer for the smoke test" }
          ./packaging/smoke-windows-msi.ps1 -Installer $Installer[0].FullName -AuthorizeDestructiveMsiSmoke
      - name: Verify unsigned installers and prepare the technical beta artifact
        shell: powershell
        run: |
          $Commit = (git rev-parse HEAD).Trim()
          $Installers = @(Get-ChildItem target\packages\windows -File -Filter *.msi)
          if ($Installers.Count -ne 2) { throw "expected exactly two localized MSI installers" }
          foreach ($Installer in $Installers) {
            if ((Get-AuthenticodeSignature -LiteralPath $Installer.FullName).Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) { throw "unsigned beta channel received an unexpectedly signed installer" }
          }
          ./packaging/prepare-unsigned-windows-beta.ps1 -PackageRoot target\packages\windows -OutputRoot target\packages\windows-unsigned-beta -Version $env:AIRWIKI_RELEASE_VERSION -CommitSha $Commit -Repository $env:GITHUB_REPOSITORY -WorkflowRunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" -RetentionDays 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airwiki-windows-x64-unsigned-beta-${{ inputs.commit_sha }}
          path: target/packages/windows-unsigned-beta
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Summarize unsigned technical beta
        shell: powershell
        run: |
          @"
          ## Windows unsigned technical beta

          - Commit: ``$env:AIRWIKI_RELEASE_COMMIT``
          - MSI state: Authenticode NotSigned (intentional)
          - Installed then uninstalled: en-US MSI
          - Updater manifest: not produced
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  publish-platform-rc:
    name: Publish macOS RC and Windows technical beta
    needs: [validate-request, macos-arm64-notarized-rc, windows-x64-unsigned-beta]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: public-release
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
    env:
      AIRWIKI_RELEASE_VERSION: ${{ needs.validate-request.outputs.version }}
      AIRWIKI_RELEASE_TAG: ${{ needs.validate-request.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Revalidate exact green source after publication approval
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [[ "$GITHUB_REPOSITORY" != "airwiki/airwiki" || "$GITHUB_REF" != "refs/heads/main" || "$commit" != "$AIRWIKI_RELEASE_COMMIT" || "$commit" != "$main" || -n "$(git status --porcelain)" ]]; then
            echo "publication source no longer matches the clean current main tip." >&2
            exit 1
          fi
          node packaging/release-version.mjs --expect "$AIRWIKI_RELEASE_VERSION"
          check_runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs?per_page=100" --jq '.check_runs[]' | jq -s '{check_runs: .}')"
          while IFS= read -r check; do
            [[ -n "$check" ]] || continue
            count="$(jq -r --arg name "$check" '[.check_runs[] | select(.name == $name)] | length' <<<"$check_runs")"
            [[ "$count" == "1" ]] || { echo "Required release check '$check' is not unique." >&2; exit 1; }
            jq -e --arg name "$check" '[.check_runs[] | select(.name == $name)] | all(.[]; .conclusion == "success" and .app.slug == "github-actions" and .app.id == 15368)' <<<"$check_runs" >/dev/null || { echo "Required release check '$check' is not green GitHub Actions." >&2; exit 1; }
          done <<<"$AIRWIKI_REQUIRED_RELEASE_CHECKS"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airwiki-macos-arm64-notarized-rc-${{ inputs.commit_sha }}
          path: target/platform-rc-input/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airwiki-windows-x64-unsigned-beta-${{ inputs.commit_sha }}
          path: target/platform-rc-input/windows
      - name: Stage and verify the closed platform RC asset set
        env:
          RC_NUMBER: ${{ inputs.rc_number }}
        shell: bash
        run: |
          set -euo pipefail
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 packaging/platform_release_candidate.py prepare \
            --input-root target/platform-rc-input \
            --macos-dmg "target/platform-rc-input/macos/AirWiki_${AIRWIKI_RELEASE_VERSION}_aarch64.dmg" \
            --macos-receipt target/platform-rc-input/macos/MACOS-VERIFICATION.json \
            --windows-en "target/platform-rc-input/windows/AirWiki_${AIRWIKI_RELEASE_VERSION}_x64_en-US.msi" \
            --windows-es "target/platform-rc-input/windows/AirWiki_${AIRWIKI_RELEASE_VERSION}_x64_es-ES.msi" \
            --output target/platform-rc \
            --version "$AIRWIKI_RELEASE_VERSION" \
            --rc-number "$RC_NUMBER" \
            --commit "$AIRWIKI_RELEASE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --generated-at "$generated_at"
      - name: Attest the exact final platform RC asset set
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/platform-rc/assets/*
      - id: draft
        name: Create or recover only the exact private draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t expected_assets < <(find target/platform-rc/assets -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_title="AirWiki ${AIRWIKI_RELEASE_VERSION} — macOS RC + Windows technical beta"
          expected_body="$(cat target/platform-rc/RELEASE_NOTES.md)"
          tag_ref="refs/tags/$AIRWIKI_RELEASE_TAG"
          tag_refs="$(git ls-remote --tags origin "$tag_ref" "${tag_ref}^{}")"
          tag_commit="$(awk -v tag="$tag_ref" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print peeled != "" ? peeled : direct }
          ' <<<"$tag_refs")"
          release_state="fresh"
          if release="$(gh release view "$AIRWIKI_RELEASE_TAG" --json assets,body,databaseId,isDraft,isImmutable,isPrerelease,name,tagName,targetCommitish 2>/dev/null)"; then
            if [[ "$(jq -r '.isPrerelease' <<<"$release")" != "true" ||
                  "$(jq -r '.tagName' <<<"$release")" != "$AIRWIKI_RELEASE_TAG" ||
                  "$(jq -r '.targetCommitish' <<<"$release")" != "$AIRWIKI_RELEASE_COMMIT" ]]; then
              echo "existing release is not the exact recoverable platform RC" >&2
              exit 1
            fi
            if [[ -n "$tag_commit" && "$tag_commit" != "$AIRWIKI_RELEASE_COMMIT" ]]; then
              echo "existing platform RC tag resolves to a different commit" >&2
              exit 1
            fi
            mapfile -t existing_assets < <(jq -r '.assets[].name' <<<"$release" | sort)
            if [[ "$(jq -r '.isDraft' <<<"$release")" == "true" ]]; then
              release_state="draft"
              unexpected="$(comm -23 <(printf '%s\n' "${existing_assets[@]}" | sed '/^$/d') <(printf '%s\n' "${expected_assets[@]}"))"
              [[ -z "$unexpected" ]] || { echo "existing draft contains unexpected assets" >&2; exit 1; }
            else
              release_state="published"
              [[ "$tag_commit" == "$AIRWIKI_RELEASE_COMMIT" ]] || { echo "published platform RC tag is missing" >&2; exit 1; }
              [[ "$(jq -r '.isImmutable' <<<"$release")" == "true" ]] || { echo "published platform RC assets are not immutable" >&2; exit 1; }
              diff -u <(printf '%s\n' "${expected_assets[@]}") <(printf '%s\n' "${existing_assets[@]}" | sed '/^$/d')
              [[ "$(jq -r '.name' <<<"$release")" == "$expected_title" ]] || { echo "published platform RC title differs" >&2; exit 1; }
              [[ "$(jq -r '.body' <<<"$release")" == "$expected_body" ]] || { echo "published platform RC notes differ" >&2; exit 1; }
              is_latest="$(gh release list --limit 100 --json tagName,isLatest | jq -r --arg tag "$AIRWIKI_RELEASE_TAG" '.[] | select(.tagName == $tag) | .isLatest')"
              [[ "$is_latest" == "false" ]] || { echo "published platform RC became Latest" >&2; exit 1; }
            fi
          else
            [[ -z "$tag_commit" ]] || { echo "platform RC tag exists without its release" >&2; exit 1; }
            # A GitHub draft records this tag name without creating its Git ref;
            # the protected v* ref is created only after verification below.
            gh release create "$AIRWIKI_RELEASE_TAG" --target "$AIRWIKI_RELEASE_COMMIT" --draft --prerelease --latest=false --title "AirWiki ${AIRWIKI_RELEASE_VERSION} — macOS RC + Windows technical beta" --notes-file target/platform-rc/RELEASE_NOTES.md
          fi
          if [[ "$release_state" != "published" ]]; then
            gh release edit "$AIRWIKI_RELEASE_TAG" --draft=true --prerelease=true --latest=false --title "$expected_title" --notes-file target/platform-rc/RELEASE_NOTES.md
            gh release upload "$AIRWIKI_RELEASE_TAG" target/platform-rc/assets/* --clobber
          fi
          release_id="$(gh release view "$AIRWIKI_RELEASE_TAG" --json databaseId --jq '.databaseId')"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
          echo "release-state=$release_state" >> "$GITHUB_OUTPUT"
      - name: Re-download and independently verify the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/platform-rc-verification/assets
          gh release download "$AIRWIKI_RELEASE_TAG" --dir target/platform-rc-verification/assets
          cp target/platform-rc/RELEASE_NOTES.md target/platform-rc-verification/RELEASE_NOTES.md
          python3 packaging/platform_release_candidate.py verify --output target/platform-rc-verification
      - name: Verify every downloaded asset against GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' asset; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package-platform-rc.yml" --source-ref "$GITHUB_REF" --source-digest "$AIRWIKI_RELEASE_COMMIT" --deny-self-hosted-runners
          done < <(find target/platform-rc-verification/assets -maxdepth 1 -type f -print0)
      - name: Bind immutable tag and publish the non-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
          RELEASE_STATE: ${{ steps.draft.outputs.release-state }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [[ "$commit" != "$AIRWIKI_RELEASE_COMMIT" || "$commit" != "$main" || -n "$(git status --porcelain)" ]]; then
            echo "platform RC source changed immediately before publication." >&2
            exit 1
          fi
          check_runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs?per_page=100" --jq '.check_runs[]' | jq -s '{check_runs: .}')"
          while IFS= read -r check; do
            [[ -n "$check" ]] || continue
            count="$(jq -r --arg name "$check" '[.check_runs[] | select(.name == $name)] | length' <<<"$check_runs")"
            [[ "$count" == "1" ]] || { echo "Required release check '$check' is not unique." >&2; exit 1; }
            jq -e --arg name "$check" '[.check_runs[] | select(.name == $name)] | all(.[]; .conclusion == "success" and .app.slug == "github-actions" and .app.id == 15368)' <<<"$check_runs" >/dev/null || { echo "Required release check '$check' is not green GitHub Actions." >&2; exit 1; }
          done <<<"$AIRWIKI_REQUIRED_RELEASE_CHECKS"

          tag_ref="refs/tags/$AIRWIKI_RELEASE_TAG"
          tag_refs="$(git ls-remote --tags origin "$tag_ref" "${tag_ref}^{}")"
          if [[ -z "$tag_refs" ]]; then
            [[ "$RELEASE_STATE" != "published" ]] || { echo "published platform RC lost its immutable tag" >&2; exit 1; }
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=$tag_ref" -f "sha=$AIRWIKI_RELEASE_COMMIT" >/dev/null
            tag_refs="$(git ls-remote --tags origin "$tag_ref" "${tag_ref}^{}")"
          fi
          tag_commit="$(awk -v tag="$tag_ref" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print peeled != "" ? peeled : direct }
          ' <<<"$tag_refs")"
          [[ "$tag_commit" == "$AIRWIKI_RELEASE_COMMIT" ]] || { echo "platform RC tag did not bind the verified commit" >&2; exit 1; }
          if [[ "$RELEASE_STATE" != "published" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          fi
          release="$(gh release view "$AIRWIKI_RELEASE_TAG" --json assets,body,isDraft,isImmutable,isPrerelease,name,tagName,targetCommitish,url)"
          latest="$(gh release list --limit 100 --json tagName,isLatest | jq -r --arg tag "$AIRWIKI_RELEASE_TAG" '.[] | select(.tagName == $tag) | .isLatest')"
          expected_title="AirWiki ${AIRWIKI_RELEASE_VERSION} — macOS RC + Windows technical beta"
          expected_body="$(cat target/platform-rc/RELEASE_NOTES.md)"
          mapfile -t expected_assets < <(find target/platform-rc-verification/assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t published_assets < <(jq -r '.assets[].name' <<<"$release" | sort)
          if [[ "$(jq -r '.isDraft' <<<"$release")" != "false" ||
                "$(jq -r '.isImmutable' <<<"$release")" != "true" ||
                "$(jq -r '.isPrerelease' <<<"$release")" != "true" ||
                "$(jq -r '.tagName' <<<"$release")" != "$AIRWIKI_RELEASE_TAG" ||
                "$(jq -r '.targetCommitish' <<<"$release")" != "$AIRWIKI_RELEASE_COMMIT" ||
                "$(jq -r '.name' <<<"$release")" != "$expected_title" ||
                "$(jq -r '.body' <<<"$release")" != "$expected_body" ||
                "$latest" != "false" ]]; then
            echo "GitHub did not publish the exact non-latest platform RC" >&2
            exit 1
          fi
          diff -u <(printf '%s\n' "${expected_assets[@]}") <(printf '%s\n' "${published_assets[@]}" | sed '/^$/d')
          {
            echo "## Published platform release candidate"
            echo
            echo "- Tag: \`$AIRWIKI_RELEASE_TAG\`"
            echo "- macOS: signed and notarized release candidate"
            echo "- Windows: unsigned technical beta, no updater"
            echo "- Latest/updater: no"
            echo "- Release assets and tag: immutable"
            echo "- URL: $(jq -r '.url' <<<"$release")"
          } >> "$GITHUB_STEP_SUMMARY"
