name: Prepare signed public release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version already committed in all AirWiki manifests
        required: true
        type: string
      commit_sha:
        description: Full commit SHA at the current tip of main
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: prepare-public-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  AIRWIKI_RELEASE_VERSION: ${{ inputs.version }}
  AIRWIKI_RELEASE_COMMIT: ${{ inputs.commit_sha }}
  AIRWIKI_UPDATE_ENDPOINT: https://github.com/airwiki/airwiki/releases/latest/download/latest.json

jobs:
  validate-source:
    name: Validate release source and gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Require the exact green tip of main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "airwiki/airwiki" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Public releases can only start from airwiki/airwiki main." >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [[ "$commit" != "$AIRWIKI_RELEASE_COMMIT" || "$commit" != "$main" ]]; then
            echo "Release commit must be the exact current tip of main." >&2
            exit 1
          fi
          node packaging/release-version.mjs \
            --expect "$AIRWIKI_RELEASE_VERSION" \
            --tag "v${AIRWIKI_RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/v${AIRWIKI_RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release tag already exists and will never be moved." >&2
            exit 1
          fi
          if gh release view "v${AIRWIKI_RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release already exists and will never be overwritten." >&2
            exit 1
          fi

          check_runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs?per_page=100")"
          required_checks=(
            "Frontend checks (macos-arm64)"
            "Frontend checks (windows-x64)"
            "Rust checks (macos-14)"
            "Rust checks (windows-2022)"
            "Advisories, licenses and sources"
          )
          for check in "${required_checks[@]}"; do
            conclusion="$(jq -r --arg name "$check" \
              '[.check_runs[] | select(.name == $name)][0].conclusion // "missing"' \
              <<<"$check_runs")"
            if [[ "$conclusion" != "success" ]]; then
              echo "Required release check '$check' is $conclusion." >&2
              exit 1
            fi
          done

  windows-release:
    name: Windows public-trust packages
    needs: validate-source
    uses: ./.github/workflows/windows-signpath.yml
    with:
      version: ${{ inputs.version }}
      commit_sha: ${{ inputs.commit_sha }}

  macos-release:
    name: Developer ID and notarized macOS package
    needs: validate-source
    runs-on: macos-14
    timeout-minutes: 90
    environment: macos-signing
    env:
      AIRWIKI_SIGNING_IDENTITY: ${{ vars.AIRWIKI_MACOS_SIGNING_IDENTITY }}
      AIRWIKI_MACOS_TEAM_ID: ${{ vars.AIRWIKI_MACOS_TEAM_ID }}
      AIRWIKI_UPDATER_PUBLIC_KEY: ${{ vars.AIRWIKI_UPDATER_PUBLIC_KEY }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm --dir apps/desktop/ui install --frozen-lockfile --ignore-scripts --prod=false
          pnpm --dir apps/desktop/ui run licenses:check macos-arm64
      - name: Sign, notarize and verify final macOS bytes
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AIRWIKI_SIGNING_IDENTITY
            AIRWIKI_MACOS_TEAM_ID
            AIRWIKI_UPDATER_PUBLIC_KEY
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
            APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64
            APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
            APPLE_API_PRIVATE_KEY_BASE64
            TAURI_SIGNING_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required macOS release setting is missing: $name" >&2
              exit 1
            fi
          done

          private_root="$(mktemp -d "${RUNNER_TEMP}/airwiki-signing.XXXXXX")"
          keychain="$private_root/release.keychain-db"
          certificate="$private_root/developer-id.p12"
          api_key="$private_root/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf -- "$private_root"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64" | base64 -D >"$certificate"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D >"$api_key"
          chmod 0600 "$certificate" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | \
            grep -F "$AIRWIKI_SIGNING_IDENTITY" >/dev/null

          APPLE_API_KEY_PATH="$api_key" ./packaging/release-macos.sh
          ./packaging/verify-macos-release.sh target/packages/macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airwiki-macos-arm64-signed
          path: |
            target/packages/macos/AirWiki_${{ inputs.version }}_aarch64.dmg
            target/packages/macos/AirWiki.app.tar.gz
            target/packages/macos/AirWiki.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14

  create-draft:
    name: Assemble immutable draft candidate
    needs: [validate-source, windows-release, macos-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airwiki-macos-arm64-signed
          path: target/public-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airwiki-windows-x64-signed-msi
          path: target/public-release
      - name: Add exact legal inventories and release metadata
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE THIRD_PARTY_NOTICES.md target/public-release/
          cp resources/licenses/THIRD_PARTY_LICENSES.md target/public-release/
          cp resources/licenses/NPM_LICENSES_MACOS_ARM64.md target/public-release/
          cp resources/licenses/NPM_LICENSES_WINDOWS_X64.md target/public-release/
          cp resources/licenses/NON_CARGO_COMPONENTS.md target/public-release/
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 packaging/generate-update-manifest.py \
            --version "$AIRWIKI_RELEASE_VERSION" \
            --published-at "$created_at" \
            --base-url "https://github.com/airwiki/airwiki/releases/download/v${AIRWIKI_RELEASE_VERSION}" \
            --macos target/public-release/AirWiki.app.tar.gz \
            --macos-signature target/public-release/AirWiki.app.tar.gz.sig \
            --windows "target/public-release/AirWiki_${AIRWIKI_RELEASE_VERSION}_x64_en-US.msi" \
            --windows-signature "target/public-release/AirWiki_${AIRWIKI_RELEASE_VERSION}_x64_en-US.msi.sig" \
            --output target/public-release/latest.json
          python3 packaging/release_assets.py generate \
            --directory target/public-release \
            --version "$AIRWIKI_RELEASE_VERSION" \
            --commit "$AIRWIKI_RELEASE_COMMIT" \
            --created-at "$created_at" \
            --workflow-run "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 packaging/release_assets.py verify \
            --directory target/public-release \
            --version "$AIRWIKI_RELEASE_VERSION" \
            --commit "$AIRWIKI_RELEASE_COMMIT"
      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v${AIRWIKI_RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release already exists and will never be overwritten." >&2
            exit 1
          fi
          gh release create "v${AIRWIKI_RELEASE_VERSION}" \
            target/public-release/* \
            --draft \
            --prerelease \
            --target "$AIRWIKI_RELEASE_COMMIT" \
            --title "AirWiki v${AIRWIKI_RELEASE_VERSION}" \
            --generate-notes
          gh release view "v${AIRWIKI_RELEASE_VERSION}" --json url --jq '.url'
