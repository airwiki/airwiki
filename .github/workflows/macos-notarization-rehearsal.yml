name: Rehearse macOS notarization

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA at the current tip of main
        required: true
        type: string
      rehearsal_confirmation:
        description: Enter rehearse-macos-notarization-<commit_sha> exactly
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: macos-notarization-rehearsal-${{ inputs.commit_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  AIRWIKI_RELEASE_COMMIT: ${{ inputs.commit_sha }}
  AIRWIKI_UPDATE_ENDPOINT: https://github.com/airwiki/airwiki/releases/latest/download/latest.json
  AIRWIKI_REQUIRED_RELEASE_CHECKS: |
    Frontend checks (macos-arm64)
    Frontend checks (windows-x64)
    Rust checks (macos-14)
    Rust checks (windows-2022)
    Advisories, licenses and sources
    Launch site checks

jobs:
  notarize:
    name: Rehearse Developer ID and notarized macOS package
    runs-on: macos-14
    timeout-minutes: 90
    environment: macos-signing
    env:
      AIRWIKI_SIGNING_IDENTITY: ${{ vars.AIRWIKI_MACOS_SIGNING_IDENTITY }}
      AIRWIKI_MACOS_TEAM_ID: ${{ vars.AIRWIKI_MACOS_TEAM_ID }}
      AIRWIKI_UPDATER_PUBLIC_KEY: ${{ vars.AIRWIKI_UPDATER_PUBLIC_KEY }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - id: source
        name: Require the exact green clean tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_CONFIRMATION: ${{ inputs.rehearsal_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$AIRWIKI_RELEASE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character SHA." >&2
            exit 1
          fi
          if [[ "$REHEARSAL_CONFIRMATION" != "rehearse-macos-notarization-${AIRWIKI_RELEASE_COMMIT}" ]]; then
            echo "rehearsal confirmation must bind the exact commit SHA." >&2
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != "airwiki/airwiki" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "macOS notarization rehearsal can only start from airwiki/airwiki main." >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [[ "$commit" != "$AIRWIKI_RELEASE_COMMIT" || "$commit" != "$main" ]]; then
            echo "Rehearsal commit must be the exact current tip of main." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Rehearsal source checkout is not clean." >&2
            exit 1
          fi
          version="$(node packaging/release-version.mjs)"
          echo "AIRWIKI_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          check_runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs?per_page=100")"
          while IFS= read -r check; do
            [[ -n "$check" ]] || continue
            matching_count="$(jq -r --arg name "$check" \
              '[.check_runs[] | select(.name == $name)] | length' \
              <<<"$check_runs")"
            if [[ "$matching_count" != "1" ]]; then
              echo "Required release check '$check' must have exactly one run; found $matching_count." >&2
              exit 1
            fi
            if ! jq -e --arg name "$check" '
              [.check_runs[] | select(.name == $name)] |
              all(.[]; .conclusion == "success" and .app.slug == "github-actions" and .app.id == 15368)
            ' <<<"$check_runs" >/dev/null; then
              echo "Required release check '$check' is not a successful GitHub Actions run." >&2
              exit 1
            fi
          done <<<"$AIRWIKI_REQUIRED_RELEASE_CHECKS"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm --dir apps/desktop/ui install --frozen-lockfile --ignore-scripts --prod=false
          pnpm --dir apps/desktop/ui run licenses:check macos-arm64
      - name: Revalidate source and green release gates before signing and notarization
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          commit="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [[ "$commit" != "$AIRWIKI_RELEASE_COMMIT" || "$commit" != "$main" ]]; then
            echo "Rehearsal commit changed before signing and notarization." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Rehearsal source checkout is not clean before signing and notarization." >&2
            exit 1
          fi
          check_runs="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$commit/check-runs?per_page=100")"
          while IFS= read -r check; do
            [[ -n "$check" ]] || continue
            matching_count="$(jq -r --arg name "$check" \
              '[.check_runs[] | select(.name == $name)] | length' \
              <<<"$check_runs")"
            if [[ "$matching_count" != "1" ]]; then
              echo "Required release check '$check' must have exactly one run; found $matching_count." >&2
              exit 1
            fi
            if ! jq -e --arg name "$check" '
              [.check_runs[] | select(.name == $name)] |
              all(.[]; .conclusion == "success" and .app.slug == "github-actions" and .app.id == 15368)
            ' <<<"$check_runs" >/dev/null; then
              echo "Required release check '$check' is not a successful GitHub Actions run." >&2
              exit 1
            fi
          done <<<"$AIRWIKI_REQUIRED_RELEASE_CHECKS"
      - name: Sign, notarize and verify rehearsal bytes
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AIRWIKI_SIGNING_IDENTITY
            AIRWIKI_MACOS_TEAM_ID
            AIRWIKI_UPDATER_PUBLIC_KEY
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
            APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64
            APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
            APPLE_API_PRIVATE_KEY_BASE64
            TAURI_SIGNING_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required macOS release setting is missing: $name" >&2
              exit 1
            fi
          done

          private_root="$(mktemp -d "${RUNNER_TEMP}/airwiki-signing.XXXXXX")"
          keychain="$private_root/release.keychain-db"
          certificate="$private_root/developer-id.p12"
          api_key="$private_root/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf -- "$private_root"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64" | base64 -D >"$certificate"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D >"$api_key"
          chmod 0600 "$certificate" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | \
            grep -F "$AIRWIKI_SIGNING_IDENTITY" >/dev/null

          APPLE_API_KEY_PATH="$api_key" ./packaging/release-macos.sh
          ./packaging/verify-macos-release.sh target/packages/macos
      - name: Revalidate source and green release gates before recording receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          commit="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [[ "$commit" != "$AIRWIKI_RELEASE_COMMIT" || "$commit" != "$main" ]]; then
            echo "Rehearsal commit changed before recording the receipt." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Rehearsal source checkout is not clean before recording the receipt." >&2
            exit 1
          fi
          check_runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs?per_page=100")"
          while IFS= read -r check; do
            [[ -n "$check" ]] || continue
            matching_count="$(jq -r --arg name "$check" \
              '[.check_runs[] | select(.name == $name)] | length' \
              <<<"$check_runs")"
            if [[ "$matching_count" != "1" ]]; then
              echo "Required release check '$check' must have exactly one run; found $matching_count." >&2
              exit 1
            fi
            if ! jq -e --arg name "$check" '
              [.check_runs[] | select(.name == $name)] |
              all(.[]; .conclusion == "success" and .app.slug == "github-actions" and .app.id == 15368)
            ' <<<"$check_runs" >/dev/null; then
              echo "Required release check '$check' is not a successful GitHub Actions run." >&2
              exit 1
            fi
          done <<<"$AIRWIKI_REQUIRED_RELEASE_CHECKS"
      - name: Record non-binary rehearsal receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/macos-notarization-rehearsal-receipt.json"
          python3 - "$receipt" "$AIRWIKI_RELEASE_COMMIT" "$AIRWIKI_RELEASE_VERSION" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          receipt, commit, version = sys.argv[1:]
          package_directory = Path("target/packages/macos")
          names = [
              f"AirWiki_{version}_aarch64.dmg",
              "AirWiki.app.tar.gz",
              "AirWiki.app.tar.gz.sig",
          ]
          artifacts = []
          for name in names:
              artifact = package_directory / name
              if artifact.is_symlink() or not artifact.is_file():
                  raise ValueError(f"missing regular rehearsal artifact: {name}")
              digest = hashlib.sha256()
              with artifact.open("rb") as payload:
                  for chunk in iter(lambda: payload.read(1024 * 1024), b""):
                      digest.update(chunk)
              artifacts.append(
                  {
                      "name": name,
                      "sha256": digest.hexdigest(),
                  }
              )
          Path(receipt).write_text(
              json.dumps(
                  {
                      "schema": "airwiki-macos-notarization-rehearsal-receipt-v1",
                      "commit": commit,
                      "version": version,
                      "verification": "release-macos-and-verify-macos-release-completed",
                      "artifacts": artifacts,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          {
            echo "### macOS notarization rehearsal"
            echo
            echo "Native signing and notarization verification completed for the requested commit."
            echo "No installer, updater archive, signature, tag, release, or updater manifest is retained or published by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airwiki-macos-notarization-rehearsal-receipt-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/macos-notarization-rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 14
