[package]
name = "airwiki-desktop"
default-run = "airwiki"
description = "Local-first desktop application for human-reviewed knowledge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "airwiki"
path = "src/main.rs"

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver", "airwiki-mcp/e2e"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
airwiki-core = { version = "0.2.0", path = "../../crates/airwiki-core", features = ["fastembed-runtime"] }
airwiki-inference = { version = "0.2.0", path = "../../crates/airwiki-inference" }
airwiki-mcp = { version = "0.2.0", path = "../../crates/airwiki-mcp" }
airwiki-network = { version = "0.2.0", path = "../../crates/airwiki-network" }
airwiki-types = { version = "0.2.0", path = "../../crates/airwiki-types" }
chrono.workspace = true
directories = "6.0.0"
fluent-bundle = "0.16.0"
futures = "0.3.31"
getrandom = "0.3.4"
hex = "0.4.3"
interprocess = "2.4.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
rfd = { version = "0.15.4", default-features = false }
serde.workspace = true
serde_json.workspace = true
semver = "1.0.27"
sha2 = "0.10.9"
sys-locale = "0.3.2"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
tokio-util = "0.7.16"
tauri = { version = "2.11.5", default-features = false, features = ["tray-icon", "wry"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
tracing.workspace = true
tracing-appender = "0.2.3"
tracing-subscriber.workspace = true
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings", "uuid-impl"] }
unic-langid = "0.9.6"
url = "2.5.8"
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "std"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["SMAppService", "SMErrors", "objc2", "objc2-foundation", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
airwiki-windows-firewall-helper = { version = "0.2.0", path = "../windows-firewall-helper" }
tempfile = "3.23.0"
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.23.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
